name: PaperAgent CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: paper-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check browser script syntax
        run: node --check app/static/app.js
      - name: Run deterministic core suite
        env:
          OPENAI_API_KEY: ""
          REASON_WITH_LLM: "false"
          EVALUATE_WITH_LLM: "false"
          LANGGRAPH_CHECKPOINT_ENABLED: "false"
        run: >-
          python -m pytest -q
          tests/test_graph_integration.py
          tests/test_intent_router.py
          tests/test_clarification.py
          tests/test_research_analysis.py
          tests/test_research_skills.py
          tests/test_research_scheduler.py
          tests/test_research_coverage_writer.py
          tests/test_research_citation_validator.py
          tests/test_citation_repair.py
          tests/test_research_report_eval.py
          tests/test_demo_page.py
          tests/test_deployment_config.py
          tests/test_zotero_mcp.py
          tests/test_github_mcp.py
          tests/test_prompt_contracts.py
          tests/test_prompt_security_eval.py
          tests/test_research_analyzer_prompt_ab.py
          tests/test_test_catalog.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --tag paper-agent:ci .
