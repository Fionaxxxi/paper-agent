<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PaperAgent 演示台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/research.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">LANGGRAPH · RESEARCH AGENT · EVIDENCE HARNESS</p>
      <h1>PaperAgent</h1>
      <p class="subtitle">科研论文智能体演示台</p>
    </div>
    <div class="status"><span></span><b>API 已连接</b><small id="mode">读取运行模式中…</small></div>
  </header>

  <main>
    <section class="panel composer">
      <div class="examples">
        <button data-query="梳理2023年以来反思型Agent架构的代表论文、方法比较、发展趋势和研究空白">深度研究报告</button>
        <button data-query="ReAct 如何结合推理与行动？">ReAct 工作模式</button>
        <button data-query="比较 GraphRAG 和 LightRAG 的核心设计">论文方法比较</button>
        <button data-query="Agent 的规划、记忆和工具使用分别有什么作用？">Agent 架构</button>
      </div>
      <label for="query">论文问题</label>
      <textarea id="query" rows="4" placeholder="输入检索、总结、比较或研究方向问题…">ReAct 如何结合推理与行动？</textarea>
      <div class="fields">
        <label>会话 ID<input id="conversation" value="resume-demo"></label>
        <label>PDF 路径（可选）<input id="pdf" placeholder="D:\papers\example.pdf"></label>
        <label>重点页码（可选，最多 3 页）<input id="pdfPages" placeholder="例如：3, 5"></label>
      </div>
      <div class="actions">
        <button id="submit" class="primary">运行 Agent <span>→</span></button>
        <button id="sample">加载示例轨迹（零 API）</button>
        <button id="pdfSample">加载PDF页示例（零 API）</button>
        <span id="requestStatus">准备就绪</span>
      </div>
    </section>

    <section id="results" class="results hidden">
      <div class="metrics" id="metrics"></div>
      <section class="panel workflow-card">
        <div class="section-title"><span>Research Agent 工作流</span><b id="taskLevel"></b></div>
        <div id="workflow" class="workflow"></div>
      </section>
      <section id="pdfTrace" class="panel pdf-trace hidden">
        <div class="section-title"><span>指定 PDF 页面分析</span><b id="pdfVisionStatus"></b></div>
        <div id="pdfTraceContent" class="pdf-trace-grid"></div>
      </section>
      <section id="researchTrace" class="research-trace hidden">
        <div class="research-grid">
          <article class="panel research-card">
            <div class="section-title"><span>研究分析与计划</span><b id="planStatus"></b></div>
            <div id="researchAnalysis"></div><div id="researchPlan" class="task-tree"></div>
          </article>
          <article class="panel research-card">
            <div class="section-title"><span>有界执行波次</span><b id="scheduleStatus"></b></div>
            <div id="schedule" class="waves"></div>
          </article>
        </div>
        <article class="panel research-card repository-card">
          <div class="section-title"><span>GitHub 代码证据</span><b id="repositoryStatus"></b></div>
          <div id="repositoryTrace" class="repository-trace"></div>
        </article>
        <article class="panel research-card">
          <div class="section-title"><span>轻量 Multi-Agent 交接</span><b id="multiAgentStatus"></b></div>
          <div id="multiAgentTrace" class="task-tree"></div>
        </article>
        <div class="research-grid">
          <article class="panel research-card">
            <div class="section-title"><span>Evidence Store</span><b id="evidenceCount"></b></div>
            <div id="evidenceStore" class="evidence-list"></div>
          </article>
          <article class="panel research-card">
            <div class="section-title"><span>证据质量闸门</span><b>Grounded Report</b></div>
            <div id="qualityGates" class="quality-gates"></div>
          </article>
        </div>
      </section>
      <article class="panel answer-card">
        <div class="section-title"><span>最终回答</span><button id="copy">复制</button></div>
        <div id="answer" class="answer"></div>
      </article>
      <div class="two-column">
        <section class="panel">
          <div class="section-title"><span>检索证据</span><b id="paperCount"></b></div>
          <div id="papers" class="papers"></div>
        </section>
        <section class="panel trace-panel">
          <div class="section-title"><span>LangGraph 执行轨迹</span><b id="traceId"></b></div>
          <div id="route" class="route"></div>
          <div id="timings" class="timings"></div>
          <div class="tool-title">调用组件</div>
          <div id="tools" class="chips"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
